version: "2"
sql:
  - engine: "postgresql"
    schema: "../../../migrations/"
    queries:
      - "./"
    gen:
      go:
        package: "queries"
        out: "."
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true

          - db_type: "pg_catalog.timestamptz"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.timestamptz"
            go_type:
              type: "time.Time"
            nullable: false

          - db_type: "pg_catalog.timestamp"
            go_type:
              type: "time.Time"
              pointer: true
            nullable: true
          - db_type: "pg_catalog.timestamp"
            go_type:
              type: "time.Time"
            nullable: false

          - db_type: "text"
            go_type: "string"
            nullable: false
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true

          - db_type: "pg_catalog.int4"
            go_type: "int"
            unsigned: true