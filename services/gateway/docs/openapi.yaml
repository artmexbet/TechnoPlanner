openapi: 3.1.0
info:
  title: Gateway Service API
  version: 1.0.0
  description: REST API exposed by the technoBro gateway service.
servers:
  - url: https://gateway.local
    description: Default environment
  - url: http://localhost:8080
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: health
    description: Health and readiness probes
  - name: auth
    description: Authentication and token lifecycle
  - name: users
    description: User management
  - name: porters
    description: Porter listings
  - name: equipment
    description: Equipment catalog management
  - name: categories
    description: Equipment categories
  - name: requests
    description: Equipment request workflows
  - name: responsibles
    description: Responsible persons management
  - name: raw-requests
    description: Raw (bot) requests management
paths:
  /healthz:
    get:
      tags: [health]
      summary: Health probe
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
  /ping:
    get:
      tags: [health]
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
  /api/v1/users/register:
    post:
      tags: [auth, users]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/users/login:
    post:
      tags: [auth, users]
      summary: Login with credentials
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/refresh:
    post:
      tags: [auth, users]
      summary: Refresh token pair
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/me:
    get:
      security:
        - bearerAuth: []
      tags: [auth, users]
      summary: Get current user info
      description: Returns information about the currently authenticated user
      responses:
        '200':
          description: Current user info
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/users/logout:
    post:
      security:
        - bearerAuth: []
      tags: [auth, users]
      summary: Logout current session
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/porters:
    get:
      security:
        - bearerAuth: []
      tags: [porters]
      summary: List porters
      responses:
        '200':
          description: Porter list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PorterListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      security:
        - bearerAuth: []
      tags: [porters]
      summary: Create a new porter
      description: Creates a new porter user. Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PorterCreateRequest'
      responses:
        '201':
          description: Porter created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: ID of the created porter
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/porters/{porterId}:
    parameters:
      - $ref: '#/components/parameters/PorterId'
    get:
      security:
        - bearerAuth: []
      tags: [porters]
      summary: Get porter by ID
      responses:
        '200':
          description: Porter found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PorterResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      security:
        - bearerAuth: []
      tags: [porters]
      summary: Update porter by ID
      description: Updates the username and email of an existing porter. Requires admin role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PorterUpdateRequest'
      responses:
        '200':
          description: Porter updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PorterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      security:
        - bearerAuth: []
      tags: [porters]
      summary: Delete porter by ID
      description: Removes a porter from the system. Requires admin role.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/equipment/categories:
    get:
      security:
        - bearerAuth: []
      tags: [categories]
      summary: List equipment categories
      responses:
        '200':
          description: Categories list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCategoryListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      security:
        - bearerAuth: []
      tags: [categories]
      summary: Create equipment category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCategoryRequest'
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCategoryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/CategoryId'
    put:
      security:
        - bearerAuth: []
      tags: [categories]
      summary: Update category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCategoryRequest'
      responses:
        '200':
          description: Category updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentCategoryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      security:
        - bearerAuth: []
      tags: [categories]
      summary: Delete category
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/equipment:
    get:
      security:
        - bearerAuth: []
      tags: [equipment]
      summary: List equipment
      responses:
        '200':
          description: Equipment list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EquipmentResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      security:
        - bearerAuth: []
      tags: [equipment]
      summary: Create equipment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentCreateRequest'
      responses:
        '201':
          description: Equipment created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/equipment/{equipmentId}:
    parameters:
      - $ref: '#/components/parameters/EquipmentId'
    get:
      security:
        - bearerAuth: []
      tags: [equipment]
      summary: Get equipment item
      responses:
        '200':
          description: Equipment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      security:
        - bearerAuth: []
      tags: [equipment]
      summary: Update equipment item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EquipmentUpdateRequest'
      responses:
        '200':
          description: Updated equipment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EquipmentResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      security:
        - bearerAuth: []
      tags: [equipment]
      summary: Soft-delete equipment
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/requests:
    get:
      security:
        - bearerAuth: []
      tags: [requests]
      summary: List requests
      parameters:
        - in: query
          name: responsible_id
          schema:
            type: string
            format: uuid
          description: Filter by responsible porter
      responses:
        '200':
          description: Requests list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestListResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/requests/{requestId}:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      security:
        - bearerAuth: []
      tags: [requests]
      summary: Get request by ID
      responses:
        '200':
          description: Request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      security:
        - bearerAuth: []
      tags: [requests]
      summary: Partially update a request
      description: >
        Updates one or more fields of a request (status, address, schedule time,
        request text, responsible person). Only provided fields are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdateRequest'
      responses:
        '200':
          description: Updated request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/requests/{requestId}/responsible:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      security:
        - bearerAuth: []
      tags: [requests]
      summary: Assign responsible porter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignResponsibleRequest'
      responses:
        '200':
          description: Assignment updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/requests/{requestId}/history:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    get:
      security:
        - bearerAuth: []
      tags: [requests]
      summary: List request status history
      responses:
        '200':
          description: History entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusHistoryListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      security:
        - bearerAuth: []
      tags: [requests]
      summary: Append status history entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestStatusUpdateRequest'
      responses:
        '201':
          description: History entry added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestStatusHistoryResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/responsibles:
    get:
      security:
        - bearerAuth: []
      tags: [responsibles]
      summary: List responsible persons
      responses:
        '200':
          description: Responsible persons list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsibleListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      security:
        - bearerAuth: []
      tags: [responsibles]
      summary: Create a responsible person
      description: Registers an existing user as a responsible person for requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsibleCreateRequest'
      responses:
        '201':
          description: Responsible person created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsibleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { $ref: '#/components/responses/InternalError' }
  /api/v1/responsibles/{responsibleId}:
    parameters:
      - name: responsibleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      security:
        - bearerAuth: []
      tags: [responsibles]
      summary: Get responsible person by ID
      responses:
        '200':
          description: Responsible person found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsibleResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      security:
        - bearerAuth: []
      tags: [responsibles]
      summary: Delete responsible person by ID
      description: Removes a responsible person from the system. Requires admin role.
      responses:
        '204': { description: Deleted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/raw-requests:
    get:
      security:
        - bearerAuth: []
      tags: [raw-requests]
      summary: List raw (bot) requests
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [new, processed]
          description: Filter by processing status. Omit to get all.
      responses:
        '200':
          description: Raw requests list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawRequestListResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/raw-requests/{rawRequestId}:
    parameters:
      - $ref: '#/components/parameters/RawRequestId'
    get:
      security:
        - bearerAuth: []
      tags: [raw-requests]
      summary: Get raw request by ID
      responses:
        '200':
          description: Raw request details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RawRequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/raw-requests/{rawRequestId}/process:
    parameters:
      - $ref: '#/components/parameters/RawRequestId'
    post:
      security:
        - bearerAuth: []
      tags: [raw-requests]
      summary: Process raw request into a formal request
      description: >
        Converts a raw Telegram bot request into a formal equipment request.
        The raw request status changes to "processed" and a new Request is created.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RawRequestProcessRequest'
      responses:
        '201':
          description: Request created, raw request updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessRawRequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EquipmentId:
      name: equipmentId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: integer
        format: int32
    PorterId:
      name: porterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RawRequestId:
      name: rawRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID of the raw request
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication required or failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
        details:
          type: string
    RegisterRequest:
      type: object
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
    RegisterResponse:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    TokenPair:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    TokenRefreshRequest:
      $ref: '#/components/schemas/TokenPair'
    MeResponse:
      type: object
      required: [id, username, email, role]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, porter]
    PorterResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PorterListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PorterResponse'
    PorterCreateRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: porter1
        email:
          type: string
          format: email
          example: porter1@example.com
        password:
          type: string
          minLength: 6
          example: securePassword123
    PorterUpdateRequest:
      type: object
      required: [username, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          example: porter1_updated
        email:
          type: string
          format: email
          example: porter1_updated@example.com
    EquipmentCategoryResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
          nullable: true
        updated_by:
          type: string
          format: uuid
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
    EquipmentCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
    EquipmentCategoryListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EquipmentCategoryResponse'
    EquipmentResponse:
