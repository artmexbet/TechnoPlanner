version: "2"
sql:
  - engine: "postgresql"
    schema: "../../../migrations/"
    queries:
      - "./"
    gen:
      go:
        package: "queries"
        out: "."
        sql_package: "pgx/v5"
        emit_exported_queries: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"

          - db_type: "pg_catalog.timestamptz"
            go_type: "time.Time"
          - db_type: "pg_catalog.timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true

          - db_type: "text"
            go_type: "string"
            nullable: false
          - db_type: "text"
            nullable: true
            go_type: "string"

          - db_type: "pg_catalog.int4"
            go_type: "int"
            unsigned: true